[package]
name = "agent-subagent-stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-protocol = { path = "../agent-protocol" }
agent-ports = { path = "../agent-ports" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The one adapter between the kernel and something outside this process: it
# starts processes, reads their output and kills their trees, so it is the
# crate that names the process API rather than a channel that hides it.
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
tempfile = "3"
