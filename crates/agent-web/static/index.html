<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爻爻</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wall"></div>

<div class="window">
  <!-- ═══════ sidebar ═══════ -->
  <aside class="side">
    <div class="side-top">
      <div class="ws" title="工作区">
        <span class="mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M5 3.8 19 10.6M19 3.8 5 10.6M5 13.4 19 20.2M19 13.4 5 20.2"/>
          </svg>
        </span>
        <span id="workspace">爻爻</span>
        <span class="tag" id="wsTag"></span>
      </div>
      <button class="new" id="newTask" title="新任务 · Ctrl N"><span>＋</span> 新任务 <span class="kbd">Ctrl N</span></button>
      <label class="search"><span class="mag">⌕</span><input id="search" type="search" placeholder="搜索会话" autocomplete="off" aria-label="搜索会话"></label>
    </div>

    <div class="threads" id="threads">
      <div class="loading"><i></i><i></i><i></i></div>
    </div>

    <div class="rz" id="rzSide" title="拖动调整侧栏宽度 · 双击复原" tabindex="0" role="separator" aria-orientation="vertical"></div>

    <div class="side-foot">
      <button class="sbtn" id="whyFoot"><span class="ic">◷</span> 推理链</button>
      <button class="sbtn" id="themeBtn"><span class="ic" id="themeIcon">☾</span> <span id="themeLabel">深色</span> <span class="rt">Ctrl J</span></button>
    </div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>

  <!-- ═══════ main ═══════ -->
  <main class="main">
    <header class="top">
      <button class="ibtn side-toggle" id="sideToggle" title="打开会话列表" aria-label="打开会话列表">☰</button>
      <div class="crumb">
        <span class="p" id="sessionTag">会话</span>
        <span class="sep" id="crumbSep" hidden>›</span>
        <span class="cur" id="sessionTitle">正在连接…</span>
      </div>
      <span class="sp"></span>
      <span class="conn" id="conn"><i></i><span id="connText">连接中</span></span>
      <span class="live" id="modelTag"><i></i><span>—</span></span>
      <details class="menu-wrap" id="exportMenu">
        <summary class="ibtn" title="导出这个会话">导出</summary>
        <div class="menu">
          <button data-export="md">Markdown</button>
          <button data-export="json">JSON</button>
        </div>
      </details>
      <button class="ibtn" id="forkBtn" title="从最近的回合边界分叉一个会话">分叉</button>
      <button class="ibtn" id="panelBtn" title="展开右侧面板">面板</button>
    </header>

    <div class="scroll" id="scroll">
      <div class="col" id="col">
        <div class="empty-state" id="empty">
          <div class="inner">
            <div class="g">爻</div>
            <h2>从一句话开始</h2>
            <p>左边是已经跑过的会话。点「新任务」或在下面输入，<kbd>Enter</kbd> 发送。<br>
              每一步工具、每一次审批都在同一条时间线上。</p>
          </div>
        </div>
        <div id="timeline"></div>
      </div>
    </div>

    <div class="docgrip" id="rzDoc" title="拖动调整正文宽度 · 双击复原" tabindex="0" role="separator" aria-orientation="horizontal">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/>
      </svg>
    </div>

    <div class="dock">
      <div class="comp">
        <div class="grip" id="grip" title="拖动调整输入框高度 · 双击复原"><span></span></div>
        <div class="composer-error" id="composerError" hidden></div>
        <div class="inp">
          <textarea id="input" placeholder="继续说…" rows="1" aria-label="给爻爻的消息"></textarea>
          <div class="inp-f">
            <button class="cbtn" id="attachBtn" disabled title="附件在 v1.1">＋</button>
            <span class="cbtn" id="modelName" title="模型由启动时的配置决定">—</span>
            <span class="cbtn" title="审批策略由 profile / AGENT_JUDGMENT 决定；审批卡上可以按次、按回合或按会话授权">审批：逐次（配置）</span>
            <span class="sp"></span>
            <button class="stop" id="stopBtn" title="在下一个步骤边界停下"><span class="sq"></span>停止</button>
            <button class="send" id="sendBtn" title="发送 · Enter">↑</button>
          </div>
        </div>
      </div>
      <div class="hint">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span class="sp"></span>
        <span id="usageHint">—</span>
      </div>
    </div>
  </main>

  <!-- ═══════ side panel ═══════ -->
  <aside class="panel" id="panel" aria-label="检查器">
    <div class="rz" id="rzPanel" title="拖动调整面板宽度 · 双击复原" tabindex="0" role="separator" aria-orientation="vertical"></div>
    <div class="p-h">
      <span class="t" id="panelTitle">检查器</span>
      <span class="sp"></span>
      <button class="ibtn" id="panelClose" title="关闭面板">✕</button>
    </div>
    <div class="p-tabs">
      <button class="p-tab on" data-pv="diff">改动 <span class="n" id="diffTabCount"></span></button>
      <button class="p-tab" data-pv="why">推理链</button>
      <button class="p-tab" data-pv="plan">计划</button>
      <button class="p-tab" data-pv="sub">子代理</button>
      <button class="p-tab" data-pv="sched">定时</button>
      <button class="p-tab" data-pv="ctx">上下文</button>
    </div>
    <div class="p-body">
      <div class="pv on" id="pv-diff">
        <div class="why-empty" id="diffBody">打开面板时读取最近一次 git.diff 观察。</div>
      </div>
      <div class="pv" id="pv-why">
        <div class="why-empty" id="whyBody">打开面板时读取这一轮的推理链。</div>
      </div>
      <div class="pv" id="pv-plan">
        <div class="why-empty" id="planBody">打开面板时读取 plan.update 写入的计划。</div>
      </div>
      <div class="pv" id="pv-sub">
        <div class="why-empty" id="subBody">打开面板时读取这个会话委派过的子代理。</div>
      </div>
      <div class="pv" id="pv-sched">
        <div class="why-empty" id="schedBody">打开面板时读取未运行的定时条目。</div>
      </div>
      <div class="pv" id="pv-ctx">
        <div class="why-empty" id="ctxBody">选中一轮之后，这里显示它真实的用量。</div>
      </div>
    </div>
  </aside>
</div>

<div class="artifact-view" id="artifactView" hidden>
  <button class="artifact-close" id="artifactClose" title="关闭">✕</button>
  <img id="artifactImage" alt="artifact 预览">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js" defer></script>
</body>
</html>
