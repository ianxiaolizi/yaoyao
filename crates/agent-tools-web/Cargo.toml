[package]
name = "agent-tools-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-protocol = { path = "../agent-protocol" }
agent-ports = { path = "../agent-ports" }
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The tool resolves a host itself before it connects, so that what it checked
# is what it reaches; `rt` and `time` are what a call runs on.
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
